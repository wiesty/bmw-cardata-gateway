name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...

  deployment-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}

    steps:
      - name: Block Dependabot Docker builds and deployments
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if jq -e '[.sender.login, .head_commit.author.username, .head_commit.author.name, .pull_request.user.login]
            | any(. == "dependabot[bot]" or . == "dependabot")' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: Dependabot commit or actor." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A human can merge a Dependabot PR, so checking the actor alone
            # does not cover merge commits. Check the original PR author too.
            PULL_REQUESTS=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
            if jq -e 'any(.[][]; .merged_at != null and .user.login == "dependabot[bot]")' <<< "$PULL_REQUESTS" > /dev/null; then
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "Deploy skipped: merged Dependabot PR." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: [deployment-policy, test]
    if: needs.deployment-policy.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/bmw-cardata-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
